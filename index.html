<html>

<head>
  <meta charset="UTF-8" />
  <title>Generative Jamdani—Based on Pix2Pix</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.6.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.6.0/addons/p5.dom.min.js"></script>
  <script src="https://unpkg.com/ml5@0.1.1/dist/ml5.min.js" type="text/javascript"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Minimal icon styles */
    button svg {
      vertical-align: middle;
      margin-right: 6px;
      fill: LightSeaGreen;
      width: 18px;
      height: 18px;
    }
  </style>
</head>

<body>
  <p style="margin-top: 12px;">====================================</p>
  <h1>Jamdani Artist</h1>
  <p>====================================</p>
  <p id="status" class="text-accent">Loading model... Please wait...</p>

  <div id="spinner" style="display: none; margin-bottom: 1rem;">
    <svg viewBox="0 0 100 100" width="30" height="30" aria-label="Loading spinner" role="img">
      <circle cx="50" cy="50" r="35" stroke="LightSeaGreen" stroke-width="10" fill="none" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite" from="0 50 50"
          to="360 50 50" />
      </circle>
    </svg>
  </div>

  <div id="app">
    <div id="input"></div>
    <img id="output" src="images/blank.png" alt="Generated Jamdani motif output" />
  </div>

  <div id="colors">
    <p>Brush Size</p>
    <input type="range" id="size" min="1" max="50" value="1" />
    <p></p>
  </div>

  <div id="buttons">
    <button id="randomBtn" class="bordered-button" title="Load a random preset sketch">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 2L15 8H9L12 2Z M12 22L9 16H15L12 22Z M2 12L8 15V9L2 12Z M22 12L16 9V15L22 12Z" />
      </svg>
      Preset Sketch
    </button>
    <button id="clearBtn" class="bordered-button" title="Clear the drawing canvas">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M18 6L6 18 M6 6L18 18" stroke="LightSeaGreen" stroke-width="2" stroke-linecap="round" />
      </svg>
      Clear
    </button>
    <button id="transferBtn" class="bordered-button" disabled title="Generate motif from sketch">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M5 12H19 M12 5L19 12L12 19" stroke="LightSeaGreen" stroke-width="2" stroke-linecap="round" />
      </svg>
      Generate Motif
    </button>
  </div>

  <script src="app.js"></script>
</body>

</html>
